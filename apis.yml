aid: jiraaf
name: Jiraaf
description: 'Jiraaf (Jiraaf Platform Private Limited, Bangalore, India) is an online
  fixed-income investment platform that lets retail investors discover, analyze, and
  invest in listed and secured bonds. Its curated product shelf spans listed corporate
  bonds, sovereign gold bonds, treasury bills, G-Secs and State Development Loans (SDLs),
  securitized debt instruments (SDIs), and fixed deposits, each surfaced with transparent
  yields, credit ratings, and a documented credit-evaluation process. Alongside the
  investing surface it publishes research reports, a bond analyser, a bond directory,
  a glossary, calculators, and educational content (Bond Gurukul webinars, blogs, and
  newsletters). Backed by Accel. Jiraaf is a consumer-facing web and mobile investing
  product and does not publish a public developer API; this profile captures its identity
  and public web properties for the API Evangelist network.'
